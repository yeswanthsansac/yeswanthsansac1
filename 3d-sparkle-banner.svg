<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%">
  <defs>
    <filter id="glow-f" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-m" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-b" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="sp" d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z" fill="#a78bfa"/>
    <path id="cr" d="M0,-10 L0,10 M-10,0 L10,0" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  </defs>
  <rect width="800" height="300" fill="#0D1117" rx="12"/>
  <style>
    .sc{transform-style:preserve-3d;perspective:800px;transform-origin:400px 150px;animation:sr 20s linear infinite;}
    @keyframes sr{0%{transform:rotateX(0deg) rotateY(0deg);}25%{transform:rotateX(15deg) rotateY(90deg);}50%{transform:rotateX(0deg) rotateY(180deg);}75%{transform:rotateX(-15deg) rotateY(270deg);}100%{transform:rotateX(0deg) rotateY(360deg);}}
    .fr{transform:translateZ(120px);animation:tf 2s ease-in-out infinite alternate;}
    @keyframes tf{0%{opacity:0.4;transform:translateZ(120px) scale(0.6);}100%{opacity:1;transform:translateZ(120px) scale(1.3);}}
    .md{transform:translateZ(0px);animation:tm 3s ease-in-out infinite alternate;}
    @keyframes tm{0%{opacity:0.2;transform:translateZ(0px) scale(0.5) rotate(0deg);}100%{opacity:0.9;transform:translateZ(0px) scale(1) rotate(45deg);}}
    .bk{transform:translateZ(-120px);animation:tb 4s ease-in-out infinite alternate;}
    @keyframes tb{0%{opacity:0.1;transform:translateZ(-120px) scale(0.4);}100%{opacity:0.6;transform:translateZ(-120px) scale(0.9);}}
    .fl1{animation:f1 6s ease-in-out infinite;}@keyframes f1{0%,100%{transform:translateZ(60px) translateY(0px);}50%{transform:translateZ(80px) translateY(-20px);}}
    .fl2{animation:f2 7s ease-in-out infinite;}@keyframes f2{0%,100%{transform:translateZ(-60px) translateY(0px);}50%{transform:translateZ(-40px) translateY(15px);}}
    .fl3{animation:f3 8s ease-in-out infinite;}@keyframes f3{0%,100%{transform:translateZ(30px) translateX(0px);}50%{transform:translateZ(50px) translateX(20px);}}
    .t1{font-family:'Segoe UI',system-ui,sans-serif;font-size:28px;font-weight:700;fill:#fff;letter-spacing:3px;opacity:0.9;}
    .t2{font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;fill:#8b949e;letter-spacing:2px;}
  </style>
  <text x="400" y="140" text-anchor="middle" class="t1">YESWANTH P</text>
  <text x="400" y="170" text-anchor="middle" class="t2">Cloud · DevOps · Infrastructure</text>
  <g class="sc" transform="translate(400,150)">
    <g class="bk" filter="url(#glow-b)">
      <use href="#sp" x="-180" y="-80" transform="scale(0.7)"/>
      <use href="#sp" x="160" y="-60" transform="scale(0.5)"/>
      <use href="#sp" x="-140" y="70" transform="scale(0.6)"/>
      <use href="#sp" x="200" y="50" transform="scale(0.4)"/>
      <use href="#cr" x="0" y="-100" stroke-width="1.5" transform="scale(0.6)"/>
      <use href="#sp" x="-220" y="20" transform="scale(0.5)"/>
      <use href="#sp" x="220" y="-20" transform="scale(0.6)"/>
    </g>
    <g class="md" filter="url(#glow-m)">
      <use href="#sp" x="-120" y="-50" transform="scale(0.9)"/>
      <use href="#sp" x="100" y="-40" transform="scale(1)"/>
      <use href="#sp" x="-80" y="60" transform="scale(0.8)"/>
      <use href="#sp" x="130" y="40" transform="scale(0.9)"/>
      <use href="#cr" x="-40" y="-70" stroke-width="2.5" transform="scale(0.8)"/>
      <use href="#cr" x="50" y="65" stroke-width="2" transform="scale(0.9)"/>
      <use href="#sp" x="0" y="85" transform="scale(0.7)"/>
      <use href="#sp" x="-160" y="0" transform="scale(0.8)"/>
      <use href="#sp" x="170" y="10" transform="scale(0.9)"/>
    </g>
    <g class="fr" filter="url(#glow-f)">
      <use href="#sp" x="-60" y="-30" transform="scale(1.2)"/>
      <use href="#sp" x="70" y="-25" transform="scale(1.1)"/>
      <use href="#sp" x="-50" y="35" transform="scale(1.3)"/>
      <use href="#sp" x="60" y="30" transform="scale(1)"/>
      <use href="#cr" x="-20" y="-45" stroke-width="3" transform="scale(1.1)"/>
      <use href="#cr" x="30" y="40" stroke-width="3.5" transform="scale(1.2)"/>
      <use href="#sp" x="0" y="0" transform="scale(1.5)"/>
      <use href="#sp" x="-90" y="15" transform="scale(1.1)"/>
      <use href="#sp" x="85" y="-15" transform="scale(1.2)"/>
    </g>
    <g class="fl1" filter="url(#glow-f)"><use href="#sp" x="-100" y="-90" transform="scale(0.8)"/><use href="#sp" x="90" y="80" transform="scale(0.7)"/></g>
    <g class="fl2" filter="url(#glow-m)"><use href="#cr" x="120" y="-80" stroke-width="2" transform="scale(0.7)"/><use href="#sp" x="-110" y="75" transform="scale(0.6)"/></g>
    <g class="fl3" filter="url(#glow-f)"><use href="#sp" x="40" y="-60" transform="scale(0.9)"/><use href="#sp" x="-50" y="55" transform="scale(0.8)"/></g>
  </g>
  <line x1="100" y1="280" x2="700" y2="280" stroke="#a78bfa" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,8">
    <animate attributeName="stroke-dashoffset" from="0" to="24" dur="3s" repeatCount="indefinite"/>
  </line>
</svg>