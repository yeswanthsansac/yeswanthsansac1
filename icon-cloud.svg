<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="20" height="20">
  <style>
    .cloud{animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-2px);}}
    .drop{animation:rain 1.5s linear infinite;}
    .drop:nth-child(2){animation-delay:0.5s;}
    .drop:nth-child(3){animation-delay:1s;}
    @keyframes rain{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(8px);opacity:0;}}
  </style>
  <path d="M8 20a5 5 0 0 1 0-10 6 6 0 0 1 11-2 5 5 0 0 1 3 9" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="cloud"/>
  <line x1="13" y1="22" x2="13" y2="25" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" class="drop"/>
  <line x1="16" y1="22" x2="16" y2="25" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" class="drop"/>
  <line x1="19" y1="22" x2="19" y2="25" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" class="drop"/>
</svg>