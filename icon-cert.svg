<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
  <style>
    .scroll{animation:unroll 3s ease-in-out infinite;transform-origin:16px 16px;}
    @keyframes unroll{0%,100%{transform:scaleX(1);}50%{transform:scaleX(1.05);}}
    .star{animation:spin 4s linear infinite;transform-origin:16px 22px;}
    @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
  </style>
  <rect x="8" y="6" width="16" height="20" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.8" class="scroll"/>
  <line x1="11" y1="11" x2="21" y2="11" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="11" y1="15" x2="19" y2="15" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M16 18l1.5 3h3l-2.5 2 1 3.5-3-2-3 2 1-3.5-2.5-2h3z" fill="#a78bfa" class="star"/>
</svg>