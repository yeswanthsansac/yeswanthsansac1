<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140" width="100%">
  <defs>
    <!-- Background gradient matching your purple theme -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161B22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Star shape -->
    <path id="star" d="M0,-10 L2.5,-3 L10,-3 L4,2 L6,10 L0,5 L-6,10 L-4,2 L-10,-3 L-2.5,-3 Z" />

    <!-- Sparkle cross -->
    <path id="sparkle" d="M0,-12 L0,12 M-12,0 L12,0" stroke-width="3" stroke-linecap="round" />

    <!-- Diamond sparkle -->
    <path id="diamond" d="M0,-8 L4,0 L0,8 L-4,0 Z" />
  </defs>

  <!-- Background -->
  <rect width="800" height="140" fill="url(#bgGrad)" rx="12" />

  <!-- Title text -->
  <text x="400" y="55" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff" letter-spacing="2">
    ✨ Welcome to My Profile ✨
  </text>
  <text x="400" y="90" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#8b949e" letter-spacing="1">
    Cloud | DevOps | Infrastructure
  </text>

  <!-- Animated twinkling stars -->
  <style>
    .twinkle { animation: twinkle 2s ease-in-out infinite alternate; transform-origin: center; }
    .twinkle-slow { animation: twinkle 3s ease-in-out infinite alternate; transform-origin: center; }
    .twinkle-fast { animation: twinkle 1.5s ease-in-out infinite alternate; transform-origin: center; }
    .float { animation: float 4s ease-in-out infinite; }
    .pulse { animation: pulse 2s ease-in-out infinite; }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.5); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.6; transform: scale(0.8); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Left side stars -->
  <use href="#star" x="60" y="30" fill="#6366f1" filter="url(#glow)" class="twinkle" style="animation-delay: 0s" />
  <use href="#sparkle" x="120" y="110" stroke="#8b5cf6" filter="url(#glow)" class="twinkle-fast" style="animation-delay: 0.3s" />
  <use href="#diamond" x="40" y="90" fill="#a78bfa" filter="url(#glow)" class="twinkle-slow" style="animation-delay: 0.6s" />
  <use href="#star" x="100" y="50" fill="#FFD700" filter="url(#glow)" class="twinkle" style="animation-delay: 0.9s" transform="scale(0.7)" />

  <!-- Right side stars -->
  <use href="#star" x="740" y="40" fill="#6366f1" filter="url(#glow)" class="twinkle-slow" style="animation-delay: 0.2s" />
  <use href="#sparkle" x="680" y="100" stroke="#00CED1" filter="url(#glow)" class="twinkle" style="animation-delay: 0.5s" />
  <use href="#diamond" x="760" y="80" fill="#FF69B4" filter="url(#glow)" class="twinkle-fast" style="animation-delay: 0.8s" />
  <use href="#star" x="700" y="60" fill="#FFD700" filter="url(#glow)" class="twinkle-slow" style="animation-delay: 1.1s" transform="scale(0.6)" />

  <!-- Floating particles -->
  <circle cx="200" cy="120" r="3" fill="#6366f1" class="pulse" style="animation-delay: 0.1s" />
  <circle cx="250" cy="25" r="2" fill="#8b5cf6" class="pulse" style="animation-delay: 0.4s" />
  <circle cx="550" cy="115" r="3" fill="#a78bfa" class="pulse" style="animation-delay: 0.7s" />
  <circle cx="600" cy="30" r="2" fill="#00CED1" class="pulse" style="animation-delay: 1.0s" />
  <circle cx="350" cy="125" r="2.5" fill="#FFD700" class="pulse" style="animation-delay: 1.3s" />
  <circle cx="450" cy="20" r="2" fill="#FF69B4" class="pulse" style="animation-delay: 1.6s" />

  <!-- Bottom border line with sparkle effect -->
  <line x1="50" y1="130" x2="750" y2="130" stroke="#6366f1" stroke-width="1" opacity="0.3" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite" />
  </line>
</svg>