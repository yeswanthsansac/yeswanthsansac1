<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
  <style>
    .b1{animation:grow1 2s ease-in-out infinite alternate;transform-origin:9px 28px;}
    .b2{animation:grow2 2s ease-in-out infinite alternate;transform-origin:16px 28px;}
    .b3{animation:grow3 2s ease-in-out infinite alternate;transform-origin:23px 28px;}
    @keyframes grow1{0%{transform:scaleY(0.3);}100%{transform:scaleY(1);}}
    @keyframes grow2{0%{transform:scaleY(0.5);}100%{transform:scaleY(1);}}
    @keyframes grow3{0%{transform:scaleY(0.2);}100%{transform:scaleY(1);}}
  </style>
  <line x1="4" y1="28" x2="28" y2="28" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="7" y="16" width="4" height="12" rx="1" fill="#a78bfa" class="b1"/>
  <rect x="14" y="10" width="4" height="18" rx="1" fill="#a78bfa" class="b2"/>
  <rect x="21" y="20" width="4" height="8" rx="1" fill="#a78bfa" class="b3"/>
</svg>