<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="28" height="28">
  <style>
    .page{animation:flip 3s ease-in-out infinite;transform-origin:16px 16px;}
    @keyframes flip{0%,100%{transform:rotateY(0deg);}50%{transform:rotateY(180deg);}}
  </style>
  <rect x="5" y="6" width="22" height="20" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.8"/>
  <line x1="5" y1="12" x2="27" y2="12" stroke="#a78bfa" stroke-width="1.5"/>
  <line x1="10" y1="6" x2="10" y2="4" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="6" x2="22" y2="4" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="10" y="16" width="12" height="8" rx="1" fill="none" stroke="#a78bfa" stroke-width="1.5" class="page"/>
  <circle cx="13" cy="20" r="1" fill="#a78bfa" class="page"/>
  <circle cx="16" cy="20" r="1" fill="#a78bfa" class="page"/>
  <circle cx="19" cy="20" r="1" fill="#a78bfa" class="page"/>
</svg>